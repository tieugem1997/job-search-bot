name: Keep Bot Alive

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes, 24/7
  workflow_dispatch:           # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: |
          curl -sf --max-time 30 https://job-search-bot-nr9a.onrender.com || echo "Service waking up..."
